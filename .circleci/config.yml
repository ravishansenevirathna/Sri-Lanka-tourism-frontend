# for self hosted
version: 2.1

jobs:
  build-and-push:
    machine: true
    resource_class: ravi-ci/my-runner 
    steps:
      - checkout
      - run:
          name: Docker Login
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Build and Push
          command: |
            docker build -t docker.io/ravishandoc/sri-lanka-tourism-frontend:latest .
            docker push docker.io/ravishandoc/sri-lanka-tourism-frontend:latest
      - run:
          name: Docker Logout
          command: docker logout

workflows:
  build-deploy:
    jobs:
      - build-and-push:
          context: docker-hub-credentials  # Reference your context
